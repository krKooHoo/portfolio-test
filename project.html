<!-- 고정 렌더러 — 발표 덱(16:9): project.html?p=<src 폴더 이름>. 장면 목록은 data/projects/<폴더>.json의 deck, 그림·코드·표·이미지는 src/<폴더>/의 기술 문서 원문에서 그대로 그립니다.
     장면: 표지(cover) → 목차(toc) → [장 표지(ch-<key>) → 장면(d-<key>)] × 장 → 결과와 회고(retro) → 맺음(end). 주소 #s=<장면 id> · #<번호>
     옛 주소(#s=hl-n · #pf-doc · #pf-highlights · 옛 기술 문서 제목 앵커 등)는 project-deck.js가 새 주소로 넘깁니다. 상세 기술문서 전문은 doc.html?p=<폴더>
