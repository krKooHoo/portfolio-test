<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A4 게이트 대조 페이지</title>
<!-- A4 대조용: 키트만 싣고 장면 3개를 마크업으로 둠. fetch에 해당하는 작업은 바로 끝나는 track 하나.
     ?mount=<ms> 이면 그 뒤에 PFScene.mount(), 없으면 mount를 부르지 않음(“mount 전 인쇄” 시험) -->
<script src="../../kit/scene-kit.js"></script>
<link rel="stylesheet" href="../../kit/scene-kit.css" />
<style>
  .pf-scene { padding: 64px; font: 40px/1.4 sans-serif; color: #17181C; }
  .pf-scene small { display: block; font-size: 20px; color: #5A5F6B; margin-top: 16px; }
</style>
</head>
<body>
<main class="pf-deck" id="deck">
  <section class="pf-scene"><h2>FX-SCENE-1</h2><small>A4 대조 장면</small></section>
  <section class="pf-scene"><h2>FX-SCENE-2</h2><small>A4 대조 장면</small></section>
  <section class="pf-scene"><h2>FX-SCENE-3</h2><small>A4 대조 장면</small></section>
</main>
<script>
  PFScene.track(Promise.resolve('data'));                  // fetch만 track하고 끝난 상태(§8-2 ④의 경쟁 조건)
  const m = new URLSearchParams(location.search).get('mount');
  if (m != null) setTimeout(() => PFScene.mount({ deck: '#deck', hud: true }), +m);
</script>
</body>
</html>
